# Veröffentlicht den statischen Export auf GitHub Pages (Branch gh-pages).
# Der Upload-Weg dieses Repos unterstützt nur Text, deshalb kommen Inhalte base64-kodiert:
#   deploy/part.*          kompletter Build (tar.gz), deploy/parts = erwartete Anzahl
#   _upload/source.tar.b64 Quelltext-Stand (wird nach main entpackt)
# Erst wenn alle Teile da sind, wird veröffentlicht; danach werden die Upload-Reste aus main entfernt.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Vollständigkeit prüfen
        id: check
        run: |
          ready=false
          if [ -f deploy/parts ] && [ "$(ls deploy/part.[0-9]* | wc -l)" = "$(cat deploy/parts)" ]; then ready=true; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Teile: $(ls deploy/part.[0-9]* 2>/dev/null | wc -l) / $(cat deploy/parts 2>/dev/null)"

      - name: Build entpacken
        if: steps.check.outputs.ready == 'true'
        run: |
          cat $(ls deploy/part.[0-9]* | sort -V) | base64 -d > /tmp/site.tgz
          mkdir -p /tmp/site && tar xzf /tmp/site.tgz -C /tmp/site && touch /tmp/site/.nojekyll
          test -f /tmp/site/index.html

      - name: Auf gh-pages veröffentlichen
        if: steps.check.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Quelltext entpacken und Upload-Reste entfernen
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f _upload/source.tar.b64 ]; then base64 -d _upload/source.tar.b64 | tar -xf -; git rm -rq _upload; fi
          git rm -rq deploy
          git add -A
          git commit -m "Upload entpackt [skip ci]"
          git push origin HEAD:main
